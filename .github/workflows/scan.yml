# Runs the Deklarado scanner automatically.
# Needs two repository secrets (GitHub → repo → Settings → Secrets and variables → Actions):
#   NEXT_PUBLIC_SUPABASE_URL
#   SUPABASE_SERVICE_ROLE_KEY

name: Scan for suspensions

on:
  schedule:
    # Every 3 hours (times are UTC; 22:00 UTC = 6:00 AM Philippine time)
    - cron: "0 1,4,7,10,13,16,19,22 * * *"
  workflow_dispatch: # adds a "Run workflow" button for manual runs

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Test the classifier
        run: npm test

      - name: Scan and save
        run: npm run scan
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
